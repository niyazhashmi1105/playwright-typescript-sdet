trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- task: UseNode@1
  inputs:
    version: '22'
  displayName: 'Install Node.js'

- script: npm ci
  displayName: 'npm ci'
- script: npx playwright install --with-deps
  displayName: 'Install Playwright browsers'
- script: npm run test:smoke
  displayName: 'Run Playwright tests'
  env:
    CI: 'true'
# - task: PublishTestResults@2
#   displayName: 'Publish test results'
#   inputs:
#     searchFolder: 'junit-report'
#     testResultsFormat: 'JUnit'
#     testResultsFiles: 'junit-results.xml'
#     mergeTestResults: true
#     failTaskOnFailedTests: true
#     testRunTitle: 'Junit Tests'
#   condition: succeededOrFailed()
- script: npm install -g allure-commandline
  displayName: 'Install Allure command line'
- script: allure generate $(System.DefaultWorkingDirectory)/allure-results --clean -o $(System.DefaultWorkingDirectory)/allure-report
  displayName: 'Generate Allure Report'
- task: PublishPipelineArtifact@1
  inputs:
    targetPath: playwright-report
    artifact: playwright-report
    publishLocation: 'pipeline'
  condition: succeededOrFailed()
- task: PublishAllureReport@2
  displayName: 'Generate and Publish Allure Report'
  condition: succeededOrFailed()
  inputs:
    allureVersion: "2.40.0"
    PathtoPublish: '$(System.DefaultWorkingDirectory)/allure-report'
    testResultsDir: 'allure-report'
    reportName: "Allure Report"
