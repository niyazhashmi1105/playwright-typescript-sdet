trigger:
  - main

pool:
  vmImage: ubuntu-latest
container: mcr.microsoft.com/playwright:v1.60.0-noble
options: --user 0:0

steps:
  - task: UseNode@1
    inputs:
      version: "22"
    displayName: "Install Node.js"
  - script: npm ci
    displayName: "npm ci"
  # - script: npx playwright install --with-deps
  #   displayName: "Install Playwright browsers"
  - script: npx playwright install chrome
    displayName: Install Chrome Browser
  - script: npm run test:smoke
    displayName: "Run Playwright tests"
    env:
      CI: "true"
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium-browser
  - task: PublishTestResults@2
    displayName: "Publish test results"
    inputs:
      searchFolder: "junit-report"
      testResultsFormat: "JUnit"
      testResultsFiles: "junit-results.xml"
      mergeTestResults: true
      failTaskOnFailedTests: true
      testRunTitle: "Junit Tests"
    condition: succeededOrFailed()
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: playwright-report
      artifact: playwright-report
      publishLocation: "pipeline"
    condition: succeededOrFailed()
  - task: PublishAllureReport@2
    displayName: "Publish to Azure Pipelines Allure Tab"
    inputs:
      testResultsDir: allure-results
      reportName: "Allure Results"
    condition: succeededOrFailed()
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: allure-results
      artifact: allure-results
      publishLocation: "pipeline"
    condition: succeededOrFailed()
