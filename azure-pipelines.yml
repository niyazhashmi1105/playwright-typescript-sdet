trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- task: UseNode@1
  inputs:
    version: '22'
  displayName: 'Install Node.js'
- task: JavaToolInstaller@0
  inputs:
    versionSpec: '17'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'
  displayName: 'Setup Java for Allure CLI'

- script: npm ci
  displayName: 'npm ci'
- script: npx playwright install --with-deps
  displayName: 'Install Playwright browsers'
- script: npm run test:smoke
  displayName: 'Run Playwright tests'
  env:
    CI: 'true'
- task: PublishTestResults@2
  displayName: 'Publish test results'
  inputs:
    searchFolder: 'junit-report'
    testResultsFormat: 'JUnit'
    testResultsFiles: 'junit-results.xml'
    mergeTestResults: true
    failTaskOnFailedTests: true
    testRunTitle: 'Junit Tests'
  condition: succeededOrFailed()
- task: PublishPipelineArtifact@1
  inputs:
    targetPath: playwright-report
    artifact: playwright-report
    publishLocation: 'pipeline'
  condition: succeededOrFailed()
- script: |
    npm install -g allure-commandline --save-dev
    npm install --save-dev allure-playwright
    allure generate allure-results --clean -o allure-report
  displayName: 'Generate Allure Report'
  condition: succeededOrFailed()
- task: PublishAllureReport@2
  displayName: 'Publish to Azure Pipelines Allure Tab'
  inputs:
    testResultsDir: allure-report
    reportName: 'Allure Report'
  condition: succeededOrFailed()
- task: PublishPipelineArtifact@1
  inputs:
    targetPath: allure-report
    artifact: allure-report
    publishLocation: 'pipeline'
  condition: succeededOrFailed()